# JARVIS — infrastructure for cloud / CI.
#
# WARNING: NOT testable in the development environment (no Docker available
# on the Termux/proot dev box). Local development uses SQLite and in-process
# services instead (see docs/architecture.md §1). This file targets the
# production topology described in docs/roadmap.md Phase 9 and will be
# validated when Docker/CI is available.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: change-me-in-production
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
