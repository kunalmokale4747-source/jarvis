name: android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: apps/android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --warning-mode none 2>&1 | tee gradle-output.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "=== Concise build errors ==="
          grep -E '^(e:|.*error:|Unresolved reference|Cannot infer type|.* FAILED|BUILD FAILED)' gradle-output.log || true
          if [ "$GRADLE_EXIT" -ne 0 ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Android Build Errors"
              grep -E '^(e:|.*error:|Unresolved reference|Cannot infer type|.* FAILED|BUILD FAILED)' gradle-output.log || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$GRADLE_EXIT"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk